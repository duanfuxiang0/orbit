name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
          - os: ubuntu-latest
            target: aarch64-linux-gnu
          - os: macos-13
            target: x86_64-macos-none
          - os: macos-14
            target: aarch64-macos-none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          PREFIX=".release/${{ matrix.target }}"
          mkdir -p .release
          zig build --release=small -Dtarget="${{ matrix.target }}" --prefix "${PREFIX}"
          test -x "${PREFIX}/bin/orbit"
          tar -C "${PREFIX}/bin" -czf ".release/orbit-${VERSION}-${{ matrix.target }}.tar.gz" orbit

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.target }}
          path: .release/orbit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orbit-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum orbit-*.tar.gz > checksums.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/orbit-*.tar.gz
            release-assets/checksums.txt
          fail_on_unmatched_files: true
